name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: |
          python3 scripts/test_build.py
          python3 scripts/test_applications.py
      # A repo made from this template may delete `examples/`, and then has no resume for CI to build.
      - name: Install LaTeX and poppler
        if: hashFiles('examples/*/base/resume.tex') != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended poppler-utils wamerican
      - name: Build the example resumes
        if: hashFiles('examples/*/base/resume.tex') != ''
        run: python3 scripts/build.py examples/*/base examples/*/jobs/*/
