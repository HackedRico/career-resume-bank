  <text x="566" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Checks the facts</text>
  <text x="566" y="177" text-anchor="middle" font-size="13" fill="#59636e">Rejects anything that</text>
  <text x="566" y="193" text-anchor="middle" font-size="13" fill="#59636e">is not in your bank</text>
