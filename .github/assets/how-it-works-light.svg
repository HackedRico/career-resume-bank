  <text x="798" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#0550ae">Your resume</text>
  <text x="798" y="177" text-anchor="middle" font-size="13" fill="#0550ae">One page, written</text>
  <text x="798" y="193" text-anchor="middle" font-size="13" fill="#0550ae">for that job</text>
