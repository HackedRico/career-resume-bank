  <text x="798" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#cae8ff">Your resume</text>
  <text x="798" y="177" text-anchor="middle" font-size="13" fill="#a5d6ff">One page, written</text>
  <text x="798" y="193" text-anchor="middle" font-size="13" fill="#a5d6ff">for that job</text>
</svg>
